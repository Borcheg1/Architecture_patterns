version: '3.8'

services:
  db:
    image: postgres:17
    container_name: pattern-db
    volumes:
      - pattern_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5533:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      retries: 5
      timeout: 5s

  db-test:
    image: postgres:17
    container_name: pattern-db-test
    volumes:
      - pattern_data:/var/lib/postgresql/data/
    env_file:
      - .env
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5534:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      retries: 5
      timeout: 5s

  api:
    build: .
    container_name: pattern-api
    env_file:
      - .env
    ports:
      - "8100:8000"
    volumes:
      - ./src:/app/src
    depends_on:
      - db

volumes:
  pattern_data:
