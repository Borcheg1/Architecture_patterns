default_language_version:
  python: python3.13
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v2.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: .venv/bin/isort
        language: python
        types: [ python ]
        args: ["--profile", "black", "--filter-files"]
        require_serial: false
        additional_dependencies: [ ]

      - id: ruff_format
        name: ruff format
        entry: .venv/bin/ruff
        language: python
        types: [python]
        args: [format]
        require_serial: false
        additional_dependencies: []

      - id: ruff_lint
        name: ruff lint
        entry: .venv/bin/ruff
        language: python
        types: [python]
        args: [check]
        require_serial: false
        additional_dependencies: []

      - id: mypy
        name: mypy
        entry: .venv/bin/mypy
        language: python
        types: [python]
        args: [--config-file, pyproject.toml]
        require_serial: false
        additional_dependencies: []
